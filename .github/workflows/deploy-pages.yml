name: Build and deploy velocity lab
on:
  push:
    branches:
      - gh-pages
  workflow_call:
    inputs:
      source_ref:
        description: Exact main commit to export
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    if: github.event_name == 'workflow_call'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROBOTICS_SOURCE_ROOT: ${{ github.workspace }}/algorithm
      ROBOTICS_SOURCE_COMMIT: ${{ inputs.source_ref }}
    steps:
      - name: Checkout website branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Checkout exact algorithm commit from main
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: algorithm
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install numpy==2.2.6
      - name: Build and compare against main sampler
        working-directory: site
        run: python -m unittest discover -s tests -p test_velocity_browser_model.py -v
      - name: Install browser test tools
        working-directory: site
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser checks with real Pyodide
        working-directory: site
        run: |
          python -m http.server 8765 --directory docs > /tmp/velocity-http.log 2>&1 &
          python -c "import urllib.request,time; time.sleep(1); urllib.request.urlopen('http://127.0.0.1:8765/').close()"
          node tests/velocity_browser_e2e.cjs
          node tests/sensor_browser_e2e.cjs
          node tests/ekf_browser_e2e.cjs
          node tests/pf_browser_e2e.cjs
      - name: Record generated site on gh-pages
        working-directory: site
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "Build velocity lab from main ${SOURCE_REF}"
            git push origin HEAD:gh-pages
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/docs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: velocity-browser-screenshots
          path: |
            site/velocity-desktop.png
            site/velocity-mobile.png
            site/sensor-desktop.png
            site/sensor-mobile.png
            site/ekf-desktop.png
            site/ekf-mobile.png
            site/pf-desktop.png
            site/pf-mobile.png
  deploy:
    needs: build
    if: github.event_name == 'workflow_call'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested site
        id: deployment
        uses: actions/deploy-pages@v4
  deploy-pushed-pages:
    if: github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout pushed gh-pages commit
        uses: actions/checkout@v4
      - name: Upload current site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy current site
        id: deployment
        uses: actions/deploy-pages@v4
