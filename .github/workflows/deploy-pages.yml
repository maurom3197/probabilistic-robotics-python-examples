name: Build and deploy robotics labs
on:
  push:
    branches:
      - gh-pages
  workflow_call:
    inputs:
      source_ref:
        description: Exact main commit to export
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    # Rebuild from the exact main commit when called by update-pages.yml.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ROBOTICS_SOURCE_ROOT: ${{ github.workspace }}/algorithm
    steps:
      - name: Checkout website branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Checkout exact algorithm commit from main
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || 'main' }}
          path: algorithm
          persist-credentials: false
      - name: Record checked-out main commit
        id: algorithm-revision
        run: |
          commit=$(git -C algorithm rev-parse HEAD)
          echo "ROBOTICS_SOURCE_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6
      - name: Build site and verify main source snapshot
        working-directory: site
        run: python -m unittest discover -s tests -p test_velocity_browser_model.py -v
      - name: Record generated site on gh-pages
        working-directory: site
        env:
          SOURCE_REF: ${{ steps.algorithm-revision.outputs.commit }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "Build velocity lab from main ${SOURCE_REF}"
            git push origin HEAD:gh-pages
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/docs
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy built site
        id: deployment
        uses: actions/deploy-pages@v4
  deploy-pushed-pages:
    if: github.ref == 'refs/heads/gh-pages'
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout pushed gh-pages commit
        uses: actions/checkout@v4
      - name: Upload current site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy current site
        id: deployment
        uses: actions/deploy-pages@v4
